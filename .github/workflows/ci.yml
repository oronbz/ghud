name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # Windows has no test runner here, but darwin-only imports must not leak into its build.
      - name: Cross-build for Windows and Linux without cgo
        if: runner.os == 'Linux'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...
