id = "visor"
name = "visor"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Install visor, a god's-eye HUD for your day, if it's missing, and open it over the current tab with one key."
platforms = ["macos", "linux"]

[[build]]
command = ["bash", "install-visor.sh"]

[[panes]]
id = "visor"
title = "visor"
placement = "overlay"
command = ["visor"]

[[actions]]
id = "toggle"
title = "visor: open or close"
description = "Open visor over the current tab, or close it when it's open there."
contexts = ["global"]
command = ["bash", "toggle-visor.sh"]
