# Run through scripts/release.sh, never directly: it pins GoReleaser, verifies a
# snapshot first and supplies GITHUB_TOKEN from the local gh login.
version: 2

project_name: visor

builds:
  # cgo because go-eventkit (Calendar and Reminders) needs it.
  - id: visor-darwin
    main: ./cmd/visor
    binary: visor
    env: [CGO_ENABLED=1]
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/oronbz/visor/internal/version.Version={{.Version}}

  - id: visor-other
    main: ./cmd/visor
    binary: visor
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/oronbz/visor/internal/version.Version={{.Version}}

  # The Weather Plugin ships beside visor, which finds it there. Pure Go everywhere.
  - id: visor-weather-darwin
    main: ./cmd/visor-weather
    binary: visor-weather
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags: [-s -w]

  - id: visor-weather-other
    main: ./cmd/visor-weather
    binary: visor-weather
    env: [CGO_ENABLED=0]
    goos: [linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w]

universal_binaries:
  - id: visor-universal
    ids: [visor-darwin]
    name_template: visor
    replace: true
  - id: visor-weather-universal
    ids: [visor-weather-darwin]
    name_template: visor-weather
    replace: true

archives:
  - id: visor
    ids: [visor-universal, visor-other, visor-weather-universal, visor-weather-other]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: visor
    ids: [visor-other, visor-weather-other]
    package_name: visor
    file_name_template: "{{ .ConventionalFileName }}"
    formats: [deb, rpm, apk]
    vendor: oronbz
    homepage: https://github.com/oronbz/visor
    maintainer: Oron Ben Zvi <1288090+oronbz@users.noreply.github.com>
    description: A god's-eye HUD for your day, in the terminal.
    bindir: /usr/bin

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: oronbz
    name: visor
  prerelease: auto

# A cask, not a formula: Homebrew runs a formula without bottles as a source
# build and demands developer tools matching macOS (Xcode 27 on macOS 27) just
# to copy two binaries. The binaries aren't notarized, so postflight_steps
# clears the quarantine flag Homebrew gives the download; it's a custom block
# because GoReleaser's hooks write the Ruby postflight Homebrew 7 deprecates.
homebrew_casks:
  - name: visor
    ids: [visor]
    repository:
      owner: oronbz
      name: homebrew-tap
      token: "{{ .Env.GITHUB_TOKEN }}"
    homepage: https://github.com/oronbz/visor
    description: A god's-eye HUD for your day, in the terminal
    commit_msg_template: "Update visor to {{ .Version }}"
    binaries: [visor, visor-weather]
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/visor", "{{ "{{" }}staged_path{{ "}}" }}/visor-weather"]
        end
      end
